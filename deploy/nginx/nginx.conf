# stolda.uz — production nginx.
# `DOMAIN` o'rniga haqiqiy domen qo'yiladi (deploy.sh buni o'zi almashtiradi).

upstream stolda_web { server web:3000; }
upstream stolda_api { server api:8000; }

# Menyu rasmlarining kichraytirilgan nusxalari (`/_next/image`). Fayl nomlari
# o'zgarmas (uuid), shuning uchun nginx ularni o'zi beradi — Next.js'ga
# faqat birinchi so'rov boradi. Docker volume'da: deploydan keyin ham turadi.
proxy_cache_path /var/cache/nginx/images levels=1:2 keys_zone=images:10m
                 max_size=2g inactive=60d use_temp_path=off;

# WebP'ni qabul qilmaydigan (juda eski) brauzer boshqa nusxa olsin.
map $http_accept $image_format {
    ~image/webp webp;
    default     orig;
}

# HTTP: faqat sertifikat tekshiruvi va HTTPS'ga yo'naltirish.
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://DOMAIN$request_uri;
    }
}

# `www` — asosiy domenning dublikati. Qidiruv tizimlari ikkala manzilni
# alohida sahifa deb hisoblamasligi uchun 301 bilan yo'naltiriladi.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://DOMAIN$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Brauzer saytni faqat HTTPS orqali ochsin (1 yil). Subdomenlar ataylab qo'shilmagan.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Menyu rasmlari yuklanadi — chegara kengroq.
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # Django: public API, admin API va Django admin.
    location ~ ^/(api|django-admin)/ {
        proxy_pass http://stolda_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Yuklangan rasmlar va Django static fayllari — to'g'ridan-to'g'ri diskdan.
    location /media/ {
        alias /srv/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Kichraytirilgan rasmlar — nginx keshidan.
    location /_next/image {
        proxy_pass http://stolda_web;
        proxy_set_header Host $host;
        proxy_set_header Accept $http_accept;
        proxy_cache images;
        proxy_cache_key "$request_uri|$image_format";
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # Fayl nomlari o'zgarmas (uuid) — Next'ning Cache-Control'iga bog'lanmaymiz.
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        # `location` dagi add_header server darajasidagilarni bekor qiladi — qaytaramiz.
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        access_log off;
    }

    # Next.js'ning o'zgarmas fayllari.
    location /_next/static/ {
        proxy_pass http://stolda_web;
        proxy_set_header Host $host;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://stolda_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
