# Dev uchun: postgres + Django + Next.js.
#
# Frontend alohida papkada turadi, shuning uchun build konteksti `../../stolda`.
# Ya'ni `stolda` va `stolda-backend` yonma-yon bo'lishi kerak:
#   Development/
#     stolda/           ← Next.js
#     stolda-backend/   ← Django (shu papka)
#
# Ishga tushirish: docker compose -f deploy/docker-compose.yml up
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stolda}
      POSTGRES_USER: ${POSTGRES_USER:-stolda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stolda}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stolda}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-stolda}
      POSTGRES_USER: ${POSTGRES_USER:-stolda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stolda}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - ../:/app
      - media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../../stolda
      dockerfile: Dockerfile
    command: npm run dev
    environment:
      API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ../../stolda:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  media:
